name: Build Langevin EQ-251A

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. -GXcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build
        run: cmake --build build --config Release

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: Langevin-EQ251A-macOS-AU
          path: build/LangevinEQ251A_artefacts/Release/AU/*.component

      - name: Upload VST3 (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Langevin-EQ251A-macOS-VST3
          path: build/LangevinEQ251A_artefacts/Release/VST3/*.vst3

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Langevin-EQ251A-Windows-VST3
          path: build/LangevinEQ251A_artefacts/Release/VST3/*.vst3
